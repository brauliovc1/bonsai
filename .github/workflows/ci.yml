name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running check. Pushes to main always run to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Package.swift needs Swift 6 (Xcode 16 or newer). If the runner's default Xcode is older, this selects
      # the newest Xcode installed on the runner, with `sudo xcode-select -s /Applications/Xcode_<x>.app`.
      - name: Select Xcode
        run: bash .github/scripts/select-xcode.sh

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # On a cold runner the first call to git or make through /usr/bin waits seconds for xcodebuild. Warming
      # them once here keeps that out of the tests, and the printed times show how cold the runner was.
      - name: Warm up the developer tools
        run: bash .github/scripts/warm-developer-tools.sh

      - name: Build
        run: swift build

      - name: Test
        timeout-minutes: 25
        run: swift test
