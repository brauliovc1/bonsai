name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces its running check. Pushes to main always run to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Package.swift needs Swift 6 (Xcode 16 or newer). If the runner's default Xcode is older, this selects
      # the newest Xcode installed on the runner, with `sudo xcode-select -s /Applications/Xcode_<x>.app`.
      - name: Select Xcode
        run: bash .github/scripts/select-xcode.sh

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
